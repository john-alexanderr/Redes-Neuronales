[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-card-fraud-professional"
version = "0.1.0"
description = "A leakage-aware, chronological credit-card fraud detection walkthrough"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ipykernel>=6.29",
    "jupyterlab>=4.0",
    "kagglehub>=0.3.4",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "seaborn>=0.13",
    "tensorflow>=2.15",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
